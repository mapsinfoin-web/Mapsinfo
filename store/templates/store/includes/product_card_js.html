<script>
(function() {
    // 1. Toast Notification Helper
    if (typeof window.showToast !== 'function') {
        window.showToast = function(msg) {
            var t = document.getElementById('cardToast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'cardToast';
                t.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translate(-50%,120px);background:#132639;color:#fff;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(19,38,57,.25);z-index:99999;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s ease;opacity:0;pointer-events:none;';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.style.opacity = '1';
            t.style.transform = 'translate(-50%,0)';
            clearTimeout(window.__cardToastTimeout);
            window.__cardToastTimeout = setTimeout(function() {
                t.style.opacity = '0';
                t.style.transform = 'translate(-50%,120px)';
            }, 2600);
        };
    }

    // 2. Swatch Preview
    if (typeof window.previewCardColor !== 'function') {
        window.previewCardColor = function(dot) {
            if (!dot) return;
            var newSrc = dot.getAttribute('data-img');
            if (!newSrc) return;
            var card = dot.closest('.card, .col-card, article');
            if (!card) return;
            var img = card.querySelector('.col-img-link img, .thumb img, img');
            if (img) {
                img.src = newSrc;
            }
        };
    }

    // 3. Wishlist Toggle
    var toggleBase = "{% url 'store:toggle_wishlist' 0 %}".replace(/0\/$/, '');
    function getCsrfToken() {
        var el = document.querySelector('[name=csrfmiddlewaretoken]');
        if (el && el.value) return el.value;
        var m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
        if (m) return decodeURIComponent(m[1]);
        return '{{ csrf_token }}';
    }

    function goToLogin() {
        window.location.href = "{% url 'store:login_user' %}?next=" + encodeURIComponent(window.location.pathname + window.location.search);
    }

    document.querySelectorAll('.col-wish, .card .wish').forEach(function (btn) {
        if (btn.__boundWish) return;
        btn.__boundWish = true;
        btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (btn.disabled) return;
            btn.disabled = true;

            fetch(toggleBase + btn.getAttribute('data-id') + '/', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'X-CSRFToken': getCsrfToken(),
                    'Content-Type': 'application/json'
                }
            })
            .then(function (response) {
                if (response.status === 401 || response.redirected) { goToLogin(); throw new Error('login'); }
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })
            .then(function (data) {
                if (data.status !== 'added' && data.status !== 'removed') throw new Error('Unexpected response');
                var isAdded = (data.status === 'added');

                if (isAdded) {
                    btn.classList.add('on');
                    var icon = btn.querySelector('i');
                    if (icon) icon.className = 'fas fa-heart';
                } else {
                    btn.classList.remove('on');
                    var icon = btn.querySelector('i');
                    if (icon) icon.className = 'far fa-heart';

                    if (window.location.pathname.indexOf('/wishlist') !== -1) {
                        var card = btn.closest('.col-card, .card, article');
                        if (card) {
                            card.style.transition = 'opacity .3s, transform .3s';
                            card.style.opacity = '0';
                            card.style.transform = 'scale(.95)';
                            setTimeout(function () {
                                card.remove();
                                var remaining = document.querySelectorAll('#wishlist-results .card, .grid .card, .grid .col-card');
                                if (!remaining.length) { window.location.reload(); }
                            }, 300);
                        }
                    }
                }

                var wishCount = document.getElementById('wishCount');
                if (wishCount) {
                    var n = parseInt(wishCount.textContent || '0', 10);
                    if (isNaN(n)) n = 0;
                    n = isAdded ? (n + 1) : Math.max(0, n - 1);
                    wishCount.textContent = n;
                    wishCount.style.display = n > 0 ? 'grid' : 'none';
                }
                showToast(isAdded ? 'Saved to wishlist' : 'Removed from wishlist');
            })
            .catch(function (error) {
                if (error.message !== 'login') {
                    console.error('Wishlist toggle failed:', error);
                    showToast('Could not update wishlist. Please try again.');
                }
            })
            .finally(function () { btn.disabled = false; });
        });
    });

    // 4. AJAX Add to Cart
    document.querySelectorAll('.add-to-cart-form').forEach(function (form) {
        if (form.__boundCart) return;
        form.__boundCart = true;
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var btn = form.querySelector('button[type="submit"]');
            if (btn && btn.disabled) return;
            var origHtml = btn ? btn.innerHTML : '';
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';
            }

            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.status === 'success') {
                    var badges = document.querySelectorAll('.actions a[href*="cart"] .badge, #cartCount');
                    if (badges.length) {
                        badges.forEach(function (b) { b.textContent = data.cart_count; b.style.display = 'grid'; });
                    }
                    if (btn) btn.innerHTML = '<i class="fas fa-check"></i> Added!';
                    showToast(data.message || 'Added to cart');
                    if (btn) {
                        setTimeout(function () {
                            btn.innerHTML = origHtml;
                            btn.disabled = false;
                        }, 1800);
                    }
                } else {
                    showToast(data.error || 'Could not add to cart');
                    if (btn) {
                        btn.innerHTML = origHtml;
                        btn.disabled = false;
                    }
                }
            })
            .catch(function () {
                form.submit();
            });
        });
    });
})();
</script>
