<style>
/* Floating WhatsApp Support Button (Shared across all pages) */
.floating-wa {
    position: fixed;
    bottom: 26px;
    right: 26px;
    z-index: 999;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #25D366;
    color: #fff;
    padding: 12px 18px 12px 14px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(37, 211, 102, .35);
    font-size: 13.5px;
    font-weight: 700;
    text-decoration: none;
    transition: all .25s ease;
}
.floating-wa i {
    font-size: 22px;
}
.floating-wa:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 12px 28px rgba(37, 211, 102, .45);
    color: #fff;
}
@media (max-width: 640px) {
    .floating-wa span { display: none; }
    .floating-wa {
        width: 50px;
        height: 50px;
        padding: 0;
        display: grid;
        place-items: center;
        bottom: 20px;
        right: 20px;
    }
    .floating-wa i { font-size: 26px; }
}
</style>
<!-- Floating WhatsApp Support Widget -->
<a href="https://wa.me/919953595557?text={% if product %}Hi%20MAPSKART!%20I%20have%20a%20question%20about%20{{ product.title|urlencode }}%20(SKU:%20{{ product.sku }})%20-%20{{ request.build_absolute_uri|urlencode }}{% elif category %}Hi%20MAPSKART!%20I%20have%20a%20question%20about%20the%20{{ category.name|urlencode }}%20collection.{% else %}Hi%20MAPSKART!%20I%20have%20a%20question%20about%20your%20jewelry%20collection.{% endif %}"
   target="_blank" rel="noopener noreferrer" class="floating-wa" aria-label="Chat on WhatsApp">
    <i class="fab fa-whatsapp"></i>
    <span>Chat with us</span>
</a>
