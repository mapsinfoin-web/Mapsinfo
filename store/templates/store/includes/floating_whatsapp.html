<style>
/* Floating WhatsApp Support Button (Shared across all pages) */
.floating-wa {
    position: fixed;
    bottom: 86px;
    right: 24px;
    z-index: 999;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #25D366;
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(37, 211, 102, .35);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: all .25s ease;
}
.floating-wa i {
    font-size: 20px;
}
.floating-wa:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 10px 24px rgba(37, 211, 102, .45);
    color: #fff;
}
@media (max-width: 640px) {
    .floating-wa span { display: none; }
    .floating-wa {
        width: 44px;
        height: 44px;
        padding: 0;
        display: grid;
        place-items: center;
        bottom: 78px;
        right: 16px;
        box-shadow: 0 4px 16px rgba(37, 211, 102, .4);
    }
    .floating-wa i { font-size: 22px; }
}

<!-- Floating WhatsApp Support Widget -->
<a href="https://wa.me/919953595557?text={% if product %}Hi%20MAPSCART!%20I%20have%20a%20question%20about%20{{ product.title|urlencode }}%20(SKU:%20{{ product.sku }})%20-%20{{ request.build_absolute_uri|urlencode }}{% elif category %}Hi%20MAPSCART!%20I%20have%20a%20question%20about%20the%20{{ category.name|urlencode }}%20collection.{% else %}Hi%20MAPSCART!%20I%20have%20a%20question%20about%20your%20jewellery%20collection.{% endif %}"
   target="_blank" rel="noopener noreferrer" class="floating-wa" aria-label="Chat on WhatsApp">

</a>
