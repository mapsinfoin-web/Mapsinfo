<style>
/* Viewport horizontal overflow prevention without breaking position: sticky */
html, body {
    overflow-x: clip !important;
    max-width: 100% !important;
}

/* ===== MAPSCART SIGNATURE MEGA-MENU & NAVIGATION STYLING ===== */
.header,
header.header,
header#header {
    position: -webkit-sticky !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 1000 !important;
    background: #ffffff;
    border-bottom: 1px solid var(--line, #D1DEE8);
    transition: box-shadow .3s ease, background .3s ease;
}
.header.scrolled,
header.header.scrolled,
header#header.scrolled {
    background: #ffffff;
    box-shadow: 0 10px 30px rgba(19, 38, 57, 0.09);
}
@media (min-width: 1101px) {
    .header,
    header.header,
    header#header {
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }
    .header.scrolled,
    header.header.scrolled,
    header#header.scrolled {
        background: rgba(255, 255, 255, 0.98);
    }
}
.header-main,
.header .container.header-main {
    max-width: var(--container, 1280px);
    margin: 0 auto;
    padding: 10px 16px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: relative;
    width: 100%;
}
.logo {
    display: inline-flex;
    align-items: flex-start;
    gap: 6px;
    flex-shrink: 0 !important;
    text-decoration: none;
}
.logo-mark {
    display: block;
    height: 35px;
    width: auto;
    margin-top: 2.5px;
    object-fit: contain;
    flex-shrink: 0 !important;
    transition: transform .25s ease;
}
.logo-text {
    display: block;
    height: 58px;
    width: auto;
    max-width: 245px;
    object-fit: contain;
    flex-shrink: 0 !important;
    transition: transform .25s ease;
}
.logo:hover .logo-mark,
.logo:hover .logo-text {
    transform: scale(1.03);
}

/* Nav Container */
.nav {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 1;
}
.nav-item {
    position: relative;
    display: flex;
    align-items: center;
}
.nav-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 10px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink, #132639);
    border-radius: 999px;
    transition: all .22s cubic-bezier(.2, .8, .2, 1);
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
}
.nav-link:hover, .nav-link.active {
    background: var(--soft, #E1E9F0);
    color: var(--navy, #1F3A66);
    font-weight: 600;
}
.nav-link.highlight-nav {
    color: var(--navy, #1F3A66);
    font-weight: 600;
    background: rgba(179, 224, 255, 0.25);
    border: 1px solid rgba(179, 224, 255, 0.6);
}
.nav-link.highlight-nav:hover, .nav-link.highlight-nav.active {
    background: rgba(179, 224, 255, 0.5);
    color: var(--navy-2, #132639);
}
.nav-sparkle {
    font-size: 13px;
    animation: pulseSparkle 2.2s infinite ease-in-out;
}
@keyframes pulseSparkle {
    0%, 100% { transform: scale(1); opacity: .85; }
    50% { transform: scale(1.22); opacity: 1; }
}
.nav-arrow {
    font-size: 10px;
    transition: transform .25s ease;
    opacity: .7;
}
.nav-item:hover .nav-arrow {
    transform: rotate(180deg);
}
.nav-link.sale {
    color: var(--red, #e5484d);
    font-weight: 600;
}
.sale-badge {
    background: var(--red, #e5484d);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 6px;
    letter-spacing: .5px;
    margin-right: 4px;
}

/* ===== DESKTOP MEGA-MENU FLYOUT ===== */
.has-megamenu {
    position: static;
}
.megamenu {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    width: 100%;
    background: #ffffff;
    border-radius: 0 0 24px 24px;
    border: 1px solid var(--line, #D1DEE8);
    border-top: none;
    box-shadow: 0 24px 56px rgba(19, 38, 57, 0.14);
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity .22s cubic-bezier(.16, 1, .3, 1), transform .22s cubic-bezier(.16, 1, .3, 1), visibility .22s;
    pointer-events: none;
    z-index: 1050;
}
/* Invisible hover bridge: covers the header padding gap so cursor never loses hover */
.megamenu::before {
    content: '';
    position: absolute;
    top: -28px;
    left: 0;
    right: 0;
    height: 28px;
    background: transparent;
    pointer-events: auto;
}
.has-megamenu:hover .megamenu,
.has-megamenu.dropdown-open .megamenu,
.megamenu:hover {
    opacity: 1 !important;
    visibility: visible !important;
    transform: translateY(0) !important;
    pointer-events: auto !important;
}
.has-megamenu:hover > .nav-link,
.has-megamenu.dropdown-open > .nav-link {
    background: var(--soft, #E1E9F0) !important;
    color: var(--navy, #1F3A66) !important;
}
.has-megamenu:hover .nav-arrow,
.has-megamenu.dropdown-open .nav-arrow {
    transform: rotate(180deg) !important;
}
.megamenu-grid {
    display: grid;
    grid-template-columns: 1.1fr 1.2fr 1.1fr 1.3fr;
    gap: 32px;
    padding: 34px 40px;
    max-width: var(--container, 1280px);
    margin: 0 auto;
}
.megamenu-col {
    display: flex;
    flex-direction: column;
}
.megamenu-heading {
    margin: 0 0 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink, #132639);
    letter-spacing: -.2px;
}
.megamenu-heading a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--navy, #1F3A66);
    transition: color .2s;
}
.megamenu-heading a:hover {
    color: var(--blue, #295CA3);
}
.megamenu-heading i {
    color: var(--blue, #295CA3);
    font-size: 14px;
}
.megamenu-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.megamenu-list li a {
    font-size: 13.5px;
    color: var(--text, #2B3F57);
    display: inline-flex;
    align-items: center;
    transition: all .2s;
    padding: 2px 0;
}
.megamenu-list li a:hover {
    color: var(--navy, #1F3A66);
    transform: translateX(4px);
    font-weight: 600;
}
.megamenu-list li.megamenu-all {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(209, 222, 232, 0.6);
}
.megamenu-list li.megamenu-all a {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 13px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: var(--navy, #1F3A66);
    background: #F0F6FC;
    border: 1px solid rgba(179, 224, 255, 0.7);
    text-decoration: none;
    transition: all .2s ease;
    width: fit-content;
}
.megamenu-list li.megamenu-all a:hover {
    background: var(--navy, #1F3A66);
    color: #ffffff !important;
    border-color: var(--navy, #1F3A66);
    transform: translateX(3px);
    box-shadow: 0 4px 12px rgba(31, 58, 102, 0.15);
}
.megamenu-list li.megamenu-all a i {
    font-size: 10px;
    transition: transform .2s ease;
}
.megamenu-list li.megamenu-all a:hover i {
    transform: translateX(2px);
    color: #ffffff !important;
}

/* Megamenu Featured Card */
.megamenu-featured {
    display: flex;
    align-items: stretch;
}
.megamenu-card {
    background: linear-gradient(135deg, #F0F6FC 0%, #E3EDF7 100%);
    border: 1px solid var(--line, #D1DEE8);
    border-radius: 18px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    position: relative;
    overflow: hidden;
}
.megamenu-card::before {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(179, 224, 255, 0.4) 0%, transparent 70%);
}
.megamenu-card-tag {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--navy, #1F3A66);
    text-transform: uppercase;
    margin-bottom: 8px;
}
.megamenu-card h5 {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink, #132639);
    margin: 0 0 8px;
    line-height: 1.3;
}
.megamenu-card p {
    font-size: 12.5px;
    color: var(--muted, #52637A);
    margin: 0 0 16px;
    line-height: 1.5;
}
.btn-megamenu-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--navy, #1F3A66);
    transition: gap .2s;
}
.btn-megamenu-cta:hover {
    gap: 10px;
    color: var(--blue, #295CA3);
}

/* Megamenu Quick Facet Strip (Metal/Finish & Price) */
.megamenu-facets-bar {
    background: #F8FAFC;
    border-top: 1px solid var(--line, #D1DEE8);
    padding: 14px 40px;
}
.megamenu-facets-inner {
    max-width: var(--container, 1280px);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
}
.megamenu-facet-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}
.megamenu-facet-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted, #52637A);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-right: 4px;
}
.megamenu-facet-label i {
    color: var(--blue, #295CA3);
}
.megamenu-facet-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px !important;
    border-radius: 999px !important;
    background: #ffffff;
    border: 1px solid var(--line, #D1DEE8);
    font-size: 12px !important;
    font-weight: 600 !important;
    color: var(--ink, #132639) !important;
    text-decoration: none;
    transition: all .2s ease;
    white-space: nowrap;
}
.megamenu-facet-pill:hover {
    background: var(--navy, #1F3A66) !important;
    border-color: var(--navy, #1F3A66) !important;
    color: #ffffff !important;
    transform: translateY(-1px);
}
.facet-swatch {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid rgba(19, 38, 57, .2);
    display: inline-block;
    flex-shrink: 0;
}

/* ===== WEDDING OCCASIONS MEGA-MENU GRID ===== */
.megamenu-occasions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 20px 30px;
    max-width: var(--container, 1280px);
    margin: 0 auto;
}
.occasion-tile {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 15px;
    background: #ffffff;
    border: 1px solid var(--line, #D1DEE8);
    border-radius: 12px;
    text-decoration: none;
    transition: all .24s cubic-bezier(.2, .8, .2, 1);
    position: relative;
}
.occasion-tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(19, 38, 57, 0.08);
    border-color: var(--navy, #1F3A66);
}
.occasion-tile-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 15px;
    flex-shrink: 0;
    transition: transform .24s ease;
}
.occasion-tile:hover .occasion-tile-icon {
    transform: scale(1.08);
}
.occasion-tile-info {
    flex: 1;
}
.occasion-tag {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--muted, #52637A);
    display: block;
    margin-bottom: 2px;
}
.occasion-tile-info h4 {
    margin: 0 0 2px;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink, #132639);
    letter-spacing: -.2px;
}
.occasion-tile-info p {
    margin: 0;
    font-size: 11.5px;
    color: var(--muted, #52637A);
    line-height: 1.3;
}
.occasion-tile-arrow {
    font-size: 11px;
    color: var(--muted, #52637A);
    transition: transform .2s, color .2s;
    opacity: .7;
}
.occasion-tile:hover .occasion-tile-arrow {
    transform: translateX(3px);
    color: var(--navy, #1F3A66);
    opacity: 1;
}

/* Occasion Concierge Banner Card */
.occasion-banner-tile {
    background: linear-gradient(135deg, var(--navy, #1F3A66) 0%, var(--navy-2, #132639) 100%);
    border-radius: 12px;
    padding: 14px 18px;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
}
.occasion-banner-tile::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, rgba(179, 224, 255, 0.25) 0%, transparent 60%);
}
.occasion-banner-inner {
    position: relative;
    z-index: 2;
}
.occasion-banner-pill {
    display: inline-block;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 1px;
    background: rgba(179, 224, 255, 0.2);
    color: var(--accent, #B3E0FF);
    border: 1px solid rgba(179, 224, 255, 0.35);
    padding: 2px 7px;
    border-radius: 999px;
    margin-bottom: 6px;
}
.occasion-banner-inner h3 {
    margin: 0 0 3px;
    font-size: 14.5px;
    font-weight: 700;
    color: #ffffff;
}
.occasion-banner-inner p {
    margin: 0 0 10px;
    font-size: 11px;
    color: #E1E9F0;
    line-height: 1.35;
}
.btn-wa-concierge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #25D366;
    color: #ffffff;
    font-size: 11.5px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    transition: transform .2s, box-shadow .2s;
    text-decoration: none;
    width: fit-content;
}
.btn-wa-concierge:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35);
}

/* ===== SEARCH, ACTIONS & RESPONSIVE TOGGLE ===== */
.search {
    flex: 0 1 180px;
    min-width: 130px;
    max-width: 220px;
    position: relative;
    margin-left: auto;
    transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
}
.search input {
    width: 100%;
    height: 38px;
    padding: 8px 36px 8px 36px;
    border-radius: 999px;
    border: 1.5px solid var(--line, #D1DEE8);
    background: var(--soft, #E1E9F0);
    font-size: 13px;
    font-family: inherit;
    color: var(--ink, #132639);
    transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    box-sizing: border-box;
}
/* Hide native browser search clear cancel button */
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration,
.search input::-webkit-search-results-button,
.search input::-webkit-search-results-decoration {
    -webkit-appearance: none !important;
    appearance: none !important;
    display: none !important;
}
.search input:hover {
    border-color: #B8D0E5;
    background: #EEF4F8;
}
.search .search-icon,
.search i.fa-search {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted, #52637A);
    font-size: 13.5px;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 2;
}
.search-close-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(19, 38, 57, 0.08);
    color: var(--ink, #132639);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: all 0.2s ease;
    z-index: 5;
}
.search-close-btn:hover {
    background: var(--navy, #1F3A66);
    color: #ffffff;
}

/* ===== FULL SIZE SEARCH EXPANSION ON TOUCH & TYPE ===== */
.header.header-search-active .search,
.search.search-active {
    position: absolute !important;
    left: 0 !important;
    right: 0 !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    z-index: 99999 !important;
}
.header.header-search-active .nav {
    opacity: 0 !important;
    pointer-events: none !important;
    visibility: hidden !important;
    transition: opacity 0.2s ease, visibility 0.2s ease;
}
.header.header-search-active .logo,
.header.header-search-active .actions {
    opacity: 0 !important;
    pointer-events: none !important;
    visibility: hidden !important;
    transition: opacity 0.2s ease, visibility 0.2s ease;
}
.header.header-search-active .search input,
.search.search-active input {
    height: 50px !important;
    font-size: 16px !important;
    padding: 12px 54px 12px 52px !important;
    background: #ffffff !important;
    border: 2px solid var(--navy, #1F3A66) !important;
    box-shadow: 0 12px 35px rgba(19, 38, 57, 0.22), 0 0 0 5px rgba(31, 58, 102, 0.15) !important;
    outline: none !important;
}
.header.header-search-active .search .search-icon,
.search.search-active .search-icon {
    left: 20px !important;
    font-size: 18px !important;
    color: var(--navy, #1F3A66) !important;
}
.header.header-search-active .search .search-close-btn,
.search.search-active .search-close-btn {
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: auto !important;
    width: 36px !important;
    height: 36px !important;
    right: 14px !important;
    font-size: 15px !important;
    cursor: pointer !important;
    z-index: 999999 !important;
}
.actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0 !important;
    margin-left: auto;
}
.notif-wrapper {
    flex-shrink: 0 !important;
}

/* ===== ACCOUNT DROPDOWN STYLING ===== */
.account-wrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0 !important;
}
.account-btn {
    cursor: pointer;
}
.account-dropdown {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: 230px;
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid var(--line, #D1DEE8);
    box-shadow: 0 16px 40px rgba(19, 38, 57, 0.16), 0 4px 12px rgba(0, 0, 0, 0.05);
    z-index: 2500;
    overflow: hidden;
    transform-origin: top right;
    animation: accountFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes accountFadeIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.account-dropdown-header {
    background: #F8FAFC;
    border-bottom: 1px solid var(--line, #D1DEE8);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
}
.account-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--navy, #1F3A66), #2A5F8C);
    color: #ffffff;
    display: grid;
    place-items: center;
    font-size: 14px;
    flex-shrink: 0;
}
.account-info {
    flex: 1;
    min-width: 0;
}
.account-name {
    font-weight: 700;
    font-size: 13.5px;
    color: var(--ink, #132639);
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.account-meta {
    font-size: 11.5px;
    color: var(--muted, #52637A);
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.account-dropdown-body {
    padding: 6px 0;
}
.account-dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink, #132639);
    text-decoration: none;
    transition: background 0.18s ease, color 0.18s ease;
}
.account-dropdown-item i {
    width: 18px;
    text-align: center;
    color: var(--navy, #1F3A66);
    font-size: 14px;
    flex-shrink: 0;
}
.account-dropdown-item:hover {
    background: #F1F5F9;
    color: var(--navy, #1F3A66);
}
.account-dropdown-divider {
    height: 1px;
    background: var(--line, #D1DEE8);
    margin: 6px 0;
}
.account-logout-item {
    color: #DC2626 !important;
    font-weight: 600;
}
.account-logout-item i {
    color: #DC2626 !important;
}
