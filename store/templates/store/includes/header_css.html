<style>
/* Viewport horizontal overflow prevention without breaking position: sticky */
html, body {
    overflow-x: clip !important;
    max-width: 100% !important;
}

/* ===== MAPSKART SIGNATURE MEGA-MENU & NAVIGATION STYLING ===== */
.header,
header.header,
header#header {
    position: -webkit-sticky !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 1000 !important;
    background: #ffffff;
    border-bottom: 1px solid var(--line, #D1DEE8);
    transition: box-shadow .3s ease, background .3s ease;
}
.header.scrolled,
header.header.scrolled,
header#header.scrolled {
    background: #ffffff;
    box-shadow: 0 10px 30px rgba(19, 38, 57, 0.09);
}
@media (min-width: 1101px) {
    .header,
    header.header,
    header#header {
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }
    .header.scrolled,
    header.header.scrolled,
    header#header.scrolled {
        background: rgba(255, 255, 255, 0.98);
    }
}
.header-main {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 0;
    position: relative;
}
.logo {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
}
.logo img {
    display: block;
    height: 46px;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    transition: transform .25s ease;
}
.logo:hover img {
    transform: scale(1.03);
}

/* Nav Container */
.nav {
    display: flex;
    align-items: center;
    gap: 4px;
}
.nav-item {
    position: relative;
    display: flex;
    align-items: center;
}
.nav-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 15px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink, #132639);
    border-radius: 999px;
    transition: all .22s cubic-bezier(.2, .8, .2, 1);
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
}
.nav-link:hover, .nav-link.active {
    background: var(--soft, #E1E9F0);
    color: var(--navy, #1F3A66);
    font-weight: 600;
}
.nav-link.highlight-nav {
    color: var(--navy, #1F3A66);
    font-weight: 600;
    background: rgba(179, 224, 255, 0.25);
    border: 1px solid rgba(179, 224, 255, 0.6);
}
.nav-link.highlight-nav:hover, .nav-link.highlight-nav.active {
    background: rgba(179, 224, 255, 0.5);
    color: var(--navy-2, #132639);
}
.nav-sparkle {
    font-size: 13px;
    animation: pulseSparkle 2.2s infinite ease-in-out;
}
@keyframes pulseSparkle {
    0%, 100% { transform: scale(1); opacity: .85; }
    50% { transform: scale(1.22); opacity: 1; }
}
.nav-arrow {
    font-size: 10px;
    transition: transform .25s ease;
    opacity: .7;
}
.nav-item:hover .nav-arrow {
    transform: rotate(180deg);
}
.nav-link.sale {
    color: var(--red, #e5484d);
    font-weight: 600;
}
.sale-badge {
    background: var(--red, #e5484d);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 6px;
    letter-spacing: .5px;
    margin-right: 4px;
}

/* ===== DESKTOP MEGA-MENU FLYOUT ===== */
.has-megamenu {
    position: static;
}
.megamenu {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    width: 100%;
    background: #ffffff;
    border-radius: 0 0 24px 24px;
    border: 1px solid var(--line, #D1DEE8);
    border-top: none;
    box-shadow: 0 24px 56px rgba(19, 38, 57, 0.14);
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity .28s cubic-bezier(.16, 1, .3, 1), transform .28s cubic-bezier(.16, 1, .3, 1), visibility .28s;
    pointer-events: none;
    z-index: 1050;
    overflow: hidden;
}
.has-megamenu:hover .megamenu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
}
.megamenu-grid {
    display: grid;
    grid-template-columns: 1.1fr 1.2fr 1.1fr 1.3fr;
    gap: 32px;
    padding: 34px 40px;
    max-width: var(--container, 1280px);
    margin: 0 auto;
}
.megamenu-col {
    display: flex;
    flex-direction: column;
}
.megamenu-heading {
    margin: 0 0 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink, #132639);
    letter-spacing: -.2px;
}
.megamenu-heading a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--navy, #1F3A66);
    transition: color .2s;
}
.megamenu-heading a:hover {
    color: var(--blue, #295CA3);
}
.megamenu-heading i {
    color: var(--blue, #295CA3);
    font-size: 14px;
}
.megamenu-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.megamenu-list li a {
    font-size: 13.5px;
    color: var(--text, #2B3F57);
    display: inline-flex;
    align-items: center;
    transition: all .2s;
    padding: 2px 0;
}
.megamenu-list li a:hover {
    color: var(--navy, #1F3A66);
    transform: translateX(4px);
    font-weight: 600;
}
.megamenu-list li.megamenu-all a {
    margin-top: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--navy, #1F3A66);
    border-bottom: 1.5px solid var(--accent, #B3E0FF);
    display: inline-block;
    padding-bottom: 1px;
}
.megamenu-list li.megamenu-all a:hover {
    border-color: var(--navy, #1F3A66);
    transform: none;
}

/* Megamenu Featured Card */
.megamenu-featured {
    display: flex;
    align-items: stretch;
}
.megamenu-card {
    background: linear-gradient(135deg, #F0F6FC 0%, #E3EDF7 100%);
    border: 1px solid var(--line, #D1DEE8);
    border-radius: 18px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    position: relative;
    overflow: hidden;
}
.megamenu-card::before {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(179, 224, 255, 0.4) 0%, transparent 70%);
}
.megamenu-card-tag {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--navy, #1F3A66);
    text-transform: uppercase;
    margin-bottom: 8px;
}
.megamenu-card h5 {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink, #132639);
    margin: 0 0 8px;
    line-height: 1.3;
}
.megamenu-card p {
    font-size: 12.5px;
    color: var(--muted, #52637A);
    margin: 0 0 16px;
    line-height: 1.5;
}
.btn-megamenu-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--navy, #1F3A66);
    transition: gap .2s;
}
.btn-megamenu-cta:hover {
    gap: 10px;
    color: var(--blue, #295CA3);
}

/* Megamenu Quick Facet Strip (Metal/Finish & Price) */
.megamenu-facets-bar {
    background: #F8FAFC;
    border-top: 1px solid var(--line, #D1DEE8);
    padding: 14px 40px;
}
.megamenu-facets-inner {
    max-width: var(--container, 1280px);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
}
.megamenu-facet-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}
.megamenu-facet-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted, #52637A);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-right: 4px;
}
.megamenu-facet-label i {
    color: var(--blue, #295CA3);
}
.megamenu-facet-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px !important;
    border-radius: 999px !important;
    background: #ffffff;
    border: 1px solid var(--line, #D1DEE8);
    font-size: 12px !important;
    font-weight: 600 !important;
    color: var(--ink, #132639) !important;
    text-decoration: none;
    transition: all .2s ease;
    white-space: nowrap;
}
.megamenu-facet-pill:hover {
    background: var(--navy, #1F3A66) !important;
    border-color: var(--navy, #1F3A66) !important;
    color: #ffffff !important;
    transform: translateY(-1px);
}
.facet-swatch {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1px solid rgba(19, 38, 57, .2);
    display: inline-block;
    flex-shrink: 0;
}

/* ===== WEDDING OCCASIONS MEGA-MENU GRID ===== */
.megamenu-occasions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 30px 40px;
    max-width: var(--container, 1280px);
    margin: 0 auto;
}
.occasion-tile {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: #ffffff;
    border: 1px solid var(--line, #D1DEE8);
    border-radius: 16px;
    text-decoration: none;
    transition: all .28s cubic-bezier(.2, .8, .2, 1);
    position: relative;
}
.occasion-tile:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(19, 38, 57, 0.08);
    border-color: var(--navy, #1F3A66);
}
.occasion-tile-icon {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 18px;
    flex-shrink: 0;
    transition: transform .28s ease;
}
.occasion-tile:hover .occasion-tile-icon {
    transform: scale(1.12);
}
.occasion-tile-info {
    flex: 1;
}
.occasion-tag {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--muted, #52637A);
    display: block;
    margin-bottom: 2px;
}
.occasion-tile-info h4 {
    margin: 0 0 3px;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink, #132639);
    letter-spacing: -.2px;
}
.occasion-tile-info p {
    margin: 0;
    font-size: 12px;
    color: var(--muted, #52637A);
    line-height: 1.35;
}
.occasion-tile-arrow {
    font-size: 12px;
    color: var(--muted, #52637A);
    transition: transform .22s, color .22s;
    opacity: .7;
}
.occasion-tile:hover .occasion-tile-arrow {
    transform: translateX(4px);
    color: var(--navy, #1F3A66);
    opacity: 1;
}

/* Occasion Concierge Banner Card */
.occasion-banner-tile {
    background: linear-gradient(135deg, var(--navy, #1F3A66) 0%, var(--navy-2, #132639) 100%);
    border-radius: 16px;
    padding: 20px 24px;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
}
.occasion-banner-tile::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, rgba(179, 224, 255, 0.25) 0%, transparent 60%);
}
.occasion-banner-inner {
    position: relative;
    z-index: 2;
}
.occasion-banner-pill {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    background: rgba(179, 224, 255, 0.2);
    color: var(--accent, #B3E0FF);
    border: 1px solid rgba(179, 224, 255, 0.35);
    padding: 3px 8px;
    border-radius: 999px;
    margin-bottom: 8px;
}
.occasion-banner-inner h3 {
    margin: 0 0 6px;
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
}
.occasion-banner-inner p {
    margin: 0 0 14px;
    font-size: 12px;
    color: #E1E9F0;
    line-height: 1.4;
}
.btn-wa-concierge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #25D366;
    color: #ffffff;
    font-size: 12.5px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 999px;
    transition: transform .2s, box-shadow .2s;
    text-decoration: none;
    width: fit-content;
}
.btn-wa-concierge:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35);
}

/* ===== SEARCH, ACTIONS & RESPONSIVE TOGGLE ===== */
.search {
    flex: 1;
    max-width: 380px;
    position: relative;
    margin-left: auto;
}
.search input {
    width: 100%;
    padding: 10px 18px 10px 42px;
    border-radius: 999px;
    border: 1px solid var(--line, #D1DEE8);
    background: var(--soft, #E1E9F0);
    font-size: 13.5px;
    font-family: inherit;
    color: var(--ink, #132639);
    transition: all .2s;
}
.search input:focus {
    background: #fff;
    border-color: var(--navy, #1F3A66);
    outline: none;
    box-shadow: 0 0 0 4px rgba(31, 58, 102, 0.12);
}
.search i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted, #52637A);
    font-size: 13px;
}
.actions {
    display: flex;
    align-items: center;
    gap: 4px;
}
.icon-btn {
    position: relative;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: var(--ink, #132639);
    font-size: 17px;
    background: none;
    border: none;
    cursor: pointer;
    transition: background .2s, color .2s;
    text-decoration: none;
}
.icon-btn:hover {
    background: var(--soft, #E1E9F0);
    color: var(--navy, #1F3A66);
}
.header .badge {
    position: absolute;
    top: 3px;
    right: 1px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--navy, #1F3A66);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: grid;
    place-items: center;
}
.nav-toggle {
    display: none;
}

/* ===== MOBILE & TABLET DRAWER ACCORDION ===== */
@media (max-width: 1100px) {
    .header,
    .header.scrolled,
    header.header,
    header#header {
        position: -webkit-sticky !important;
        position: sticky !important;
        top: 0 !important;
        z-index: 1000 !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: #ffffff !important;
        transform: none !important;
        filter: none !important;
        perspective: none !important;
        contain: none !important;
    }
    body.nav-open .header {
        z-index: 999999 !important;
    }
    .header-main {
        gap: 14px;
    }
    .nav {
        display: none !important;
        position: fixed !important;
        top: 68px; /* dynamically updated by JS to rect.bottom */
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        min-height: calc(100vh - 68px) !important;
        height: auto !important;
        background: #ffffff !important;
        flex-direction: column !important;
        align-items: stretch !important;
        padding: 16px 20px 100px !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
        box-shadow: 0 25px 50px rgba(15, 23, 42, 0.25) !important;
        gap: 8px !important;
        z-index: 999999 !important;
        border-top: 1px solid rgba(226, 232, 240, 0.9) !important;
    }
    body.nav-open {
        overflow: hidden !important;
    }
    .nav.open {
        display: flex !important;
    }
    .nav-toggle {
        display: grid;
    }
    .has-megamenu {
        position: static;
        flex-direction: column;
        align-items: stretch;
    }
    .nav-link {
        width: 100%;
        justify-content: space-between;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 12px;
        color: var(--ink, #132639);
    }
    .has-megamenu.active-mobile > .nav-dropdown-trigger {
        background: var(--soft, #E1E9F0);
        color: var(--navy, #1F3A66);
    }
    .has-megamenu.active-mobile > .nav-dropdown-trigger .nav-arrow {
        transform: rotate(180deg);
    }
    .megamenu {
        position: static;
        box-shadow: none;
        border: 1px solid var(--line, #D1DEE8);
        opacity: 1;
        visibility: visible;
        transform: none;
        display: none;
        background: #F8FAFD;
        border-radius: 14px;
        margin: 6px 0 12px;
        padding: 14px 16px;
    }
    .has-megamenu.active-mobile .megamenu {
        display: block;
    }
    .megamenu-grid {
        grid-template-columns: 1fr;
        padding: 0;
        gap: 18px;
    }
    .megamenu-col {
        border-bottom: 1px solid rgba(209, 222, 232, 0.6);
        padding-bottom: 14px;
    }
    .megamenu-col:last-child {
        border-bottom: none;
        padding-bottom: 0;
    }
    .megamenu-heading {
        margin: 0 0 10px;
        font-size: 14.5px;
    }
    .megamenu-list {
        gap: 6px;
    }
    .megamenu-list li a {
        font-size: 13.5px;
        padding: 6px 10px;
        border-radius: 8px;
        display: block;
        width: 100%;
    }
    .megamenu-list li a:hover {
        background: #EDF3F9;
        color: var(--navy, #1F3A66);
        transform: none;
    }
    .megamenu-card {
        padding: 16px;
    }
    .megamenu-facets-bar {
        padding: 14px 10px;
        background: transparent;
        border-top: 1px solid var(--line, #D1DEE8);
        margin-top: 12px;
    }
    .megamenu-facets-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }
    .megamenu-facet-group {
        gap: 6px;
    }
    .megamenu-occasions-grid {
        grid-template-columns: 1fr;
        padding: 0;
        gap: 10px;
    }
    .occasion-tile {
        padding: 12px 14px;
        gap: 12px;
    }
    .occasion-banner-tile {
        padding: 16px;
    }
    .search {
        max-width: none;
    }

    /* Mobile Quick Footer Actions */
    .nav-mobile-footer {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--line, #D1DEE8);
    }
    .nav-mobile-actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }
    .nav-mobile-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 14px;
        border-radius: 12px;
        font-size: 13.5px;
        font-weight: 600;
        text-decoration: none;
        background: #F1F5F9;
        color: var(--ink, #132639);
        border: 1px solid var(--line, #D1DEE8);
        transition: all .2s ease;
    }
    .nav-mobile-btn.primary {
        background: var(--navy, #1F3A66);
        color: #ffffff;
        border-color: var(--navy, #1F3A66);
    }
    .nav-mobile-wa {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 16px;
        border-radius: 12px;
        background: #25D366;
        color: #ffffff !important;
        font-size: 13.5px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
    }
    .nav-mobile-trust {
        display: flex;
        align-items: center;
        justify-content: space-around;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted, #52637A);
        padding: 6px 0;
        gap: 10px;
    }
    .nav-mobile-trust span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .nav-mobile-trust i {
        color: var(--navy, #1F3A66);
    }
    .megamenu-mobile-all-link {
        display: block !important;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px dashed var(--line, #D1DEE8);
    }
    .megamenu-mobile-all-link a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #ffffff;
        border: 1px solid var(--navy, #1F3A66);
        border-radius: 10px;
        color: var(--navy, #1F3A66);
        font-size: 13.5px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 2px 6px rgba(31, 58, 102, 0.08);
    }
    .megamenu-mobile-all-link a i {
        color: var(--navy, #1F3A66);
    }
}
@media (min-width: 1101px) {
    .nav-mobile-footer,
    .megamenu-mobile-all-link {
        display: none !important;
    }
}

/* ===== MOBILE HEADER TWO-ROW RESPONSIVE ARCHITECTURE ===== */
