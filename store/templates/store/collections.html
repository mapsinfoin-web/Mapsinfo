{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collections | MAPSKART</title>

    <!-- Google Fonts: Poppins (main), Cormorant for accents -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --brand-navy: #0f2247;
            --brand-accent: #b1832e;
            --brand-accent-light: #ddb35e;
            --heading: #0e1b32;
            --text-muted: #7a8aa3;
            --bg-page: #f7f9fc;
            --bg-footer: #081428;
            --hairline: rgba(15, 34, 71, 0.16);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;  /* changed to Poppins */
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            color: var(--text-muted);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            padding: 30px 50px;   /* increased padding for larger logo */
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-footer);
        }
        .brand-logo img {
            height: 120px;   /* increased from 60px */
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.5));
        }
        .nav-links {
            display: flex;
            gap: 40px;
        }
        .nav-links a {
            color: #fff;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            transition: color 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: var(--brand-accent);
        }
        .nav-links a.active {
            color: var(--brand-accent);
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            text-align: center;
            padding: 80px 20px 40px 20px;
        }
        .page-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 48px;
            color: var(--heading);
            margin: 0 0 10px 0;
            font-weight: 500;
        }
        .page-header p {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 300;
        }

        /* ===== COLLECTIONS GRID ===== */
        .collections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 100px 20px;
            flex: 1;
        }

        .collection-card {
            background: var(--brand-navy);
            color: #fff;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .collection-card::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(221, 179, 94, 0.3);
            pointer-events: none;
            transition: all 0.4s ease;
        }
        .collection-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(15, 34, 71, 0.2);
        }
        .collection-card:hover::before {
            border-color: var(--brand-accent);
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
        }

        .collection-card h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            margin: 0;
            font-weight: 400;
            z-index: 2;
        }
        .collection-card span {
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--brand-accent-light);
            margin-top: 10px;
            z-index: 2;
            font-weight: 400;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .navbar {
                padding: 16px 20px;
            }
            .brand-logo img {
                height: 75px;
            }
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 16px 20px;
            }
            .brand-logo img {
                height: 60px;
            }
            .nav-links {
                gap: 20px;
            }
            .page-header h1 {
                font-size: 36px;
            }
            .collections-grid {
                grid-template-columns: 1fr;
                max-width: 350px;
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <a href="{% url 'store:all_products' %}" class="brand-logo">
            <img src="{% static 'logo.jpeg' %}" alt="MAPSKART Logo" />
        </a>
        <div class="nav-links">
            <a href="{% url 'store:all_products' %}">Shop</a>
            <a href="{% url 'store:collections' %}" class="active">Collections</a>
            <a href="{% url 'store:about' %}">About</a>
            <a href="{% url 'store:contact' %}">Contact</a>
        </div>
    </nav>

    <!-- ===== PAGE HEADER ===== -->
    <div class="page-header">
        <h1>Curated Collections</h1>
        <p>Explore our pieces by category</p>
    </div>

    <!-- ===== COLLECTIONS GRID ===== -->
    <div class="collections-grid">
        {% for category in categories %}
        <a href="{% url 'store:collection_detail' category.slug %}" class="collection-card">
            <h2>{{ category.name }}</h2>
            <span>View Collection</span>
        </a>
        {% empty %}
        <p style="text-align: center; width: 100%; color: var(--text-muted); font-weight: 300;">Collections are currently being curated.</p>
        {% endfor %}
    </div>

</body>
</html>
