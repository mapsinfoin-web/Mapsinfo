{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collections | MAPSCART</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reusing your luxury variables */
        :root { --brand-navy: #0f2247; --brand-accent: #b1832e; --heading: #0e1b32; --bg-page: #f7f9fc; --bg-panel: #eef2f8; --text-muted: #7a8aa3; }
        body { font-family: 'Jost', sans-serif; margin: 0; padding: 0; background-color: var(--bg-page); }
        
        /* Navbar Placeholder styling */
        .navbar { padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background-color: #081428; }
        .brand-logo img { height: 60px; }
        .nav-links a { color: #fff; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-right: 20px;}
        
        /* Collections Header */
        .page-header { text-align: center; padding: 80px 20px 40px 20px; }
        .page-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 48px; color: var(--heading); margin: 0 0 10px 0; font-weight: 500; }
        .page-header p { color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; font-size: 11px; }
        
        /* Collections Grid */
        .collections-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; max-width: 1000px; margin: 0 auto; padding: 0 20px 100px 20px; }
        .collection-card { background: var(--brand-navy); color: #fff; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; border-radius: 8px; transition: transform 0.4s ease, box-shadow 0.4s ease; position: relative; overflow: hidden; }
        .collection-card::before { content: ''; position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px; border: 1px solid rgba(221, 179, 94, 0.3); pointer-events: none; transition: all 0.4s ease; }
        .collection-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(15, 34, 71, 0.2); }
        .collection-card:hover::before { border-color: var(--brand-accent); top: 10px; left: 10px; right: 10px; bottom: 10px; }
        
        .collection-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin: 0; font-weight: 400; z-index: 2; }
        .collection-card span { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #ddb35e; margin-top: 10px; z-index: 2; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'store:all_products' %}" class="brand-logo"><img src="{% static 'logo.jpeg' %}" alt="MAPSCART Logo" /></a>
        <div class="nav-links">
            <a href="{% url 'store:all_products' %}">Return to Shop</a>
        </div>
    </nav>

    <div class="page-header">
        <h1>Curated Collections</h1>
        <p>Explore our pieces by category</p>
    </div>

    <div class="collections-grid">
        {% for category in categories %}
        <a href="{% url 'store:collection_detail' category.slug %}" class="collection-card">
            <h2>{{ category.name }}</h2>
            <span>View Collection</span>
        </a>
        {% empty %}
        <p style="text-align: center; width: 100%; color: var(--text-muted);">Collections are currently being curated.</p>
        {% endfor %}
    </div>
</body>
</html>
