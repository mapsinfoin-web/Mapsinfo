{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | MAPSCART</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-accent: #a3702f;
            --heading: #241a0f;
            --text-main: #4a3c2c;
            --bg-page: #f7f0e1;
            --bg-panel: #efe3c8;
            --bg-footer: #1c130b;
            --hairline: rgba(163, 112, 47, 0.28);
        }
        * { box-sizing: border-box; }
        body { font-family: 'Jost', sans-serif; margin: 0; padding: 0; background-color: var(--bg-page); color: var(--text-main); }
        
        /* Navbar */
        .navbar { width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-footer); }
        .brand-logo img { height: 60px; }
        
        /* Checkout Layout */
        .checkout-wrapper { max-width: 1100px; margin: 60px auto; padding: 0 20px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 50px; }
        .checkout-title { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--heading); margin-bottom: 30px; font-weight: 500; }
        
        /* Form Styles */
        .checkout-form { background: var(--bg-panel); padding: 40px; border-radius: 8px; border: 1px solid var(--hairline); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cfc09a; background: transparent; border-radius: 4px; font-family: 'Jost', sans-serif; }
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }
        
        /* Summary Styles */
        .order-summary { background: var(--bg-panel); padding: 40px; border-radius: 8px; border: 1px solid var(--hairline); height: fit-content; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--hairline); }
        .summary-item:last-child { border-bottom: none; }
        .item-details h4 { margin: 0 0 5px 0; font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--heading); }
        .item-details p { margin: 0; font-size: 13px; color: var(--text-muted); }
        .summary-total { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 2px solid var(--hairline); font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; color: var(--heading); }
        
        .btn-primary { width: 100%; background: var(--brand-accent); color: #fff; padding: 18px; border: none; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border-radius: 30px; margin-top: 20px; transition: background 0.3s ease; }
        .btn-primary:hover { background: #8c6234; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'store:all_products' %}" class="brand-logo">
            <img src="{% static 'logo.jpeg' %}" alt="MAPSCART Logo">
        </a>
    </nav>

    <div class="checkout-wrapper">
        <!-- Left Side: Shipping Form -->
        <div>
            <h1 class="checkout-title">Shipping Details</h1>
            <form method="POST" class="checkout-form">
                {% csrf_token %}
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" required value="{{ user.username|default:'' }}">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required value="{{ user.email|default:'' }}">
                </div>
                <div class="form-group">
                    <label>Street Address</label>
                    <textarea name="shipping_address" rows="3" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" name="city" required>
                    </div>
                    <div class="form-group">
                        <label>Postal Code</label>
                        <input type="text" name="postal_code" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Place Order</button>
            </form>
        </div>

        <!-- Right Side: Order Summary -->
        <div class="order-summary">
            <h2 class="checkout-title" style="font-size: 28px; margin-bottom: 25px;">Order Summary</h2>
            
            {% for item in cart_items %}
            <div class="summary-item">
                <div class="item-details">
                    <h4>{{ item.product.title }}</h4>
                    <p>Qty: {{ item.quantity }}</p>
                </div>
                <div>${{ item.sub_total }}</div>
            </div>
            {% endfor %}
            
            <div class="summary-total">
                <span>Total</span>
                <span>${{ total }}</span>
            </div>
        </div>
    </div>

</body>
</html>
